# stream-buddy の設定ファイルの例
# すべての項目に既定値があり、書かなかった項目は既定値になります。
# 知らない項目（書き間違い）があると起動時にエラーになります。

[server]
port = 8765                  # 1024〜65535

[audio]
device = ""                  # 空文字なら OS の既定のマイク。それ以外はデバイス名（の一部）
                             # デバイス名は `stream-buddy --list-devices` で調べられる
speech_threshold_db = -40.0  # -80.0〜0.0。これより大きい音量を「発話中」とみなす

[silence]
seconds = 20                 # 5〜600。この秒数だけ発話がなければ沈黙ハンターが動く

[hotkeys]
death = "F9"                 # F1〜F12 のみ
clear = "F10"                # F1〜F12 のみ。death と同じキーは不可

[keywords]
enabled = true               # false にすると音声認識（Vosk）を使わない
model_dir = ""               # 空文字なら <exe のフォルダ>/models/vosk-model-small-ja-0.22。指定するなら絶対パスのみ
death = ["死んだ", "やられた"]  # 各 1〜20 文字、最大 20 個
clear = ["クリア", "やったー"]  # 同上
decoys = ["やっぱり", "クリーム", "しんどい", "かったるい"]
                             # おとりの言葉（0〜20 個、各 1〜20 文字）。キーワードに似た音の言葉を入れると、
                             # それと認識されたときは検知しない。キーワードと同じ言葉は不可

[display]
background = "transparent"   # "transparent" または "chroma"

[log]
enabled = false              # true のときだけ配信ログを書く
output_dir = ""              # enabled = true のときは必須。絶対パスのみ
include_speech_text = false  # 発話テキストを残すか（プライバシーのため既定は false）

[lines]
file = ""                    # 空文字なら既定のセリフ集。自分のセリフ集を使うときは絶対パスで指定
                             # （UTF-8（BOM の有無は問わない）の TOML、64 KB まで。読めない・誤りがあるときは起動しない）
