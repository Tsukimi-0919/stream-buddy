# プルリクエストと main への push で品質・セキュリティチェックを行う。
# Actions はタグ指定になっている。Phase 0 の最後にコミットハッシュ固定へ切り替える（SR-10）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN の権限は最小にする（SR-10）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: pre-commit（gitleaks ほか）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: pre-commit を全ファイルに実行
        run: uvx pre-commit run --all-files --show-diff-on-failure

  detect:
    name: Python コードの有無を確認
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: pyproject.toml があるか
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: テスト・型・依存の脆弱性
    runs-on: windows-latest
    needs: detect
    # pyproject.toml ができるまでは skip（Phase 0 時点ではコードがないため）
    if: needs.detect.outputs.has_python == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: 依存をロックファイルどおりに入れる
        run: uv sync --locked --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: 型チェック
        run: uv run mypy src
      - name: テスト
        run: uv run pytest
      - name: 依存の脆弱性チェック（SR-08）
        shell: bash
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
