[project]
name = "stream-buddy"
version = "0.1.0"
description = "1人配信の相棒「メンダコ」を OBS のブラウザソースに表示するツール"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
stream-buddy = "stream_buddy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_buddy"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
spike-asr = [
    "faster-whisper>=1.2.1",
    "vosk>=0.3.45",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
allowed-confusables = ["（", "）", "：", "～", "！", "？"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
