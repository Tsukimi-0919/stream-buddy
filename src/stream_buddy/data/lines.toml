# メンダコのセリフ集（既定）
#
# - 一人称は「ボク」、口調はフランク
# - 1つのセリフは 1〜80 文字。改行は入れない
# - 各場面 1〜30 個。同じ場面では、直前に出したセリフは続けて選ばれない
# - 自分のセリフ集を使うときは、このファイルをコピーして書き換え、
#   config.toml の [lines] file に場所を書く

[silence]
# 黙ってから話しかけるとき。そのときのテンションで選ぶ
calm = [
  "ふむふむ…ボクはここで見てるからね～",
  "お茶でも飲む？ ボクは海水でいいけど🍵",
  "静かだね～。深海みたいで落ち着くな～",
  "ねえねえ、今なに考えてたの？",
  "ボク、ちょっと眠くなってきたかも…",
]
normal = [
  "おーい、ボクのこと忘れてない？",
  "急に静かになったね。集中してる？",
  "ねえ、チャットのみんなも待ってるよ～",
  "ひまだから、ボク踊っちゃおっかな～",
  "そろそろ何かしゃべってほしいな～",
]
high = [
  "さっきまでの勢いはどこいったの～！？",
  "あれ、燃え尽きちゃった？",
  "嵐の前の静けさってやつ？ ドキドキ…",
  "ボク、まだ盛り上がってるんだけど～！",
]

[tension]
# テンションが High になったとき
high = [
  "うおおお！ きてるきてる！🔥",
  "その調子だー",
  "テンション上がってきた～！",
  "ボクまでワクワクしてきた！",
  "いいぞいいぞ～！",
]
cheer = [
  "まだまだいけるよ～！",
  "この勢い、止まらないね！",
  "ボク、ずっとワクワクしてる！",
  "いいねいいね～！ その調子！",
  "チャットも盛り上がってるかな？🔥",
]

[event]
# 死亡の演出
death = [
  "ち～ん…👻",
  "あちゃ～…ドンマイ！",
  "だ、大丈夫…？ ボクがついてるよ",
  "次はいける！ ボクが保証する！",
  "うう…ボクまで沈んじゃう…",
]
# クリアの演出
clear = [
  "GG！🎉",
  "やったー！ さすがだね！",
  "ナイスすぎる！ ボクも鼻が高いよ～",
  "勝利のダンス、いっくよ～！",
  "見てた見てた！ かっこよかった！",
]
